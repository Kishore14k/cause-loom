<app-page-header title="Incidents" subtitle="Every incident the agent or you opened, read from the graph.">
  <button class="button secondary" type="button" [disabled]="loading()" (click)="refresh()">
    <app-icon name="refresh" /> Refresh
  </button>
  <a class="button primary" routerLink="/investigation"><app-icon name="spark" /> Investigate</a>
</app-page-header>

<app-notice-banner [notice]="notice()" (dismissed)="notice.set(null)" />

@if (loading()) {
  <div class="working" role="status"><span class="spinner"></span>Waiting for the backend</div>
}

<section class="panel">
  <div class="toolbar">
    <div class="search">
      <app-icon name="search" />
      <input
        aria-label="Search incidents"
        placeholder="Search incidents or root causes"
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </div>
    <select aria-label="Filter incident status" [ngModel]="status()" (ngModelChange)="status.set($event)">
      <option value="all">All statuses</option>
      <option value="open">Open</option>
      <option value="closed">Closed</option>
    </select>
  </div>

  <app-incident-list [incidents]="records()" [loading]="loading()" (resolveRequested)="requestResolution($event)" />

  <div class="list-footer">
    <span>{{ records().length }} of {{ incidents().length }} incidents</span>
    <span>Resolved alerts stay in the graph as evidence.</span>
  </div>
</section>

<app-confirm-dialog
  title="Resolve this incident?"
  [message]="
    'Close ' + (pending()?.id || '') + ' and resolve its linked alerts? This changes graph state only. It does not repair an external system.'
  "
  confirmLabel="Resolve incident"
  (confirmed)="resolve()"
/>
