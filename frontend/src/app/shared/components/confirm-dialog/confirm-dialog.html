<dialog #dialog [attr.aria-labelledby]="headingId">
  <header>
    <h2 [id]="headingId">{{ title() }}</h2>
    <button class="icon-button" aria-label="Cancel" type="button" (click)="close()">
      <app-icon name="close" />
    </button>
  </header>
  <p>{{ message() }}</p>
  <div class="actions">
    <button class="button secondary" type="button" (click)="close()">Cancel</button>
    <button
      class="button"
      type="button"
      [class.danger]="destructive()"
      [class.primary]="!destructive()"
      (click)="confirm()"
    >
      {{ confirmLabel() }}
    </button>
  </div>
</dialog>
